<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 87 100'%3E%3Cpath fill='%2397302b' d='M43.5 0 87 25v50L43.5 100 0 75V25z'/%3E%3C/svg%3E"
    />
    <title>Turbohaven</title>
    <script>
      // Links that name a rulebook section or spoiler list go on to the rulebook.
      if (location.search || location.hash) location.replace('rules/' + location.search + location.hash);
    </script>
    <style>
      @import './shared/site.css';

      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background: var(--frost);
      }

      main {
        width: min(44rem, 100%);
      }

      h1 {
        margin: 0;
        font: 400 clamp(3rem, 10vw, 4.5rem) / 1 var(--display);
        color: var(--seal);
      }

      @media (prefers-color-scheme: dark) {
        h1 {
          color: var(--ink);
        }
      }

      .intro {
        margin: 0.5rem 0 2rem;
        color: var(--iron);
      }

      nav {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
        gap: 1rem;
      }

      nav a {
        display: block;
        padding: 1.25rem 1.4rem 1.4rem;
        color: inherit;
        text-decoration: none;
        background: var(--paper);
        border: 1px solid var(--rule);
        border-top: 4px solid var(--glacier);
      }

      nav a:hover {
        border-color: var(--glacier);
      }

      nav a:focus-visible {
        outline: 2px solid var(--glacier);
        outline-offset: 2px;
      }

      nav strong {
        display: block;
        font: 400 1.9rem/1.1 var(--heading);
        color: var(--glacier);
      }

      nav span {
        display: block;
        margin-top: 0.4rem;
        color: var(--iron);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Turbohaven</h1>
      <p class="intro">A Frosthaven companion that keeps the game's surprises sealed.</p>
      <nav>
        <a href="rules/">
          <strong>Rulebook</strong>
          <span>The rules, with sticker and envelope text kept back until your campaign reaches it.</span>
        </a>
        <a href="scenarios/">
          <strong>Scenarios</strong>
          <span>Set up and play a scenario one step at a time, without reading ahead.</span>
        </a>
      </nav>
    </main>
  </body>
</html>
